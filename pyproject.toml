[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A-Maze-ing: A maze generator and solver with interactive visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "tchemin", email = "tchemin@student.42lyon.fr"},
    {name = "mobenhab", email = "mobenhab@student.42lyon.fr"}
]
keywords = ["maze", "generator", "solver", "visualization", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/hicham-bnh/amazing"
Repository = "https://github.com/hicham-bnh/amazing.git"
Issues = "https://github.com/hicham-bnh/amazing/issues"

[tool.setuptools]
packages = ["mazegen", "mazegen._wheels"]

[tool.setuptools.package-data]
mazegen = ["_wheels/*.whl"]

[tool.setuptools.data-files]
"." = ["requirements.txt"]